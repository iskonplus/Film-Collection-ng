<section class="container search">
  <h1>Find your film</h1>
  <input type="text" name="name" id="input" placeholder="Search films...">
</section>
<section class="container">
  @for (film of filmService.films();  track film.id) {
  <app-film-card [film]="film" (favoriteToggled)="favoriteToggled($event)"></app-film-card>
  }
</section>
